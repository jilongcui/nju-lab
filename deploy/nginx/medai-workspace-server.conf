# ===== NJU-Lab 平台侧实验工作台 —— 主 server（medai.nju.edu.cn）内的片段 =====
#
# 部署：cp 到 /etc/nginx/snippets/，并在 /etc/nginx/sites-enabled/cms.conf 的那个 server 里加一行
#       include /etc/nginx/snippets/medai-workspace-server.conf;
#      （放在 include medai-foxcms.conf 之前之后都行：这里全是 ^~ 前缀 location，
#        优先级高于 FoxCMS 的正则 location，不会被 `\.(js|css|…)$` 抢走）
# 另一半（http{} 级）见 medai-workspace-http.conf。
#
# 形态：**页面认路径 + dsh 写死的根路径认 cookie**
#   · /lab/ws/<wsKey>/…            → 路径里的 key（严格，伪造 key 403）
#   · /api/**、/plugins/**、/open-in-app/** → 会话 cookie（nju_ws）认领容器；
#     没有/无效会话 → 204 无 header → 由上面的 map 回落 FoxCMS（其它系统完全不受影响）
#   · cookie 由后端 GET /lab/api/workspace/enter?k=<wsKey> 种下（前端「进入实验环境」走它）
#
# ⚠️ 转发到容器的 location 一律用 `$ws_out_host`（定义在 medai-workspace-http.conf），
#    而不是直接写 `$http_host`。原因：上游反代若没配 `proxy_set_header Host`，nginx
#    会默认填 `$proxy_host`（= proxy_pass 的目标地址）—— 2026-09-29 抓包实测它传进来的
#    是内网 IP `10.28.128.56`，而 dsh 的 WebSocket 会拿 Origin（`https://medai.nju.edu.cn`）
#    校验它看到的 Host，**Host 不对时 HTTP 全通、WebSocket 一律 403**
#    （表现：「页面能打开、一直 connection lost, retry #N」）。
#    `$ws_out_host` 把非 medai.nju.edu.cn 的 Host 纠正回对外 authority；
#    上游把 Host 改对之后这条兜底无害（会原样透传）。

# 工作台鉴权子请求（key 直接读 cookie：auth 子请求能看到父请求的头；
# 注意 auth_request 的 URI **不支持变量**，所以不能让上层把 key 拼进 URI）
# —— 这两个 location 转发给后端 NestJS（127.0.0.1:3100），与对外 authority 无关，
#    所以仍用 `$host`，**不换** `$ws_out_host`。
location = /__ws-auth-fallback {
    internal;
    proxy_pass http://127.0.0.1:3100/api/workspace/proxy-auth?k=$cookie_nju_ws&mode=fallback;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
}
location = /__ws-auth-strict {
    internal;
    proxy_pass http://127.0.0.1:3100/api/workspace/proxy-auth?k=$cookie_nju_ws;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
}

# 工作台页面与静态资源：/lab/ws/<wsKey>/…
location ^~ /lab/ws/ {
    # 供响应阶段（proxy_redirect / sub_filter）用；必须在 rewrite 之前 ——
    # `rewrite … break` 会终止同一 location 里后续的 rewrite 指令（含 set），实测踩过
    set $ws_page_key "";
    if ($cookie_nju_ws ~ "^[0-9a-f]{32}$") { set $ws_page_key $cookie_nju_ws; }
    # 去掉 /lab/ws/<key> 前缀：dsh 认为自己就在根路径
    rewrite "^/lab/ws/(?<pk2>[0-9a-f]{32})(/.*)?$" $2 break;

    auth_request /__ws-auth-strict;
    auth_request_set $ws_up_page $upstream_http_x_workspace_upstream;

    proxy_pass http://$ws_up_page;
    proxy_http_version 1.1;
    # 外部 authority：dsh 的 WebSocket 会校验 Origin 与它看到的 Host 一致
    proxy_set_header Host $ws_out_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    # dsh 的 303 是 `location: /` → 改回带前缀；`<base href="/">` 同理
    # （相对路径 ./assets、./manifest.webmanifest 靠它解析到本前缀）
    proxy_redirect ~^/(.*)$ /lab/ws/$ws_page_key/$1;
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    # 一次替换同时做两件事：改 base + 注入「WS→HTTPS 桥」的客户端适配脚本。
    # 脚本必须**同步**加载（不加 defer/async）且位于 dsh 的 boot 脚本之前，
    # 所以挂在 <head><base …> 后面；桥不可用时它会自动退回原生 WebSocket。
    sub_filter '<base href="/">' '<base href="/lab/ws/$ws_page_key/"><script src="/wsbridge/client.js"></script>';
    # 0.1.7 起 dsh 改为输出 `<base href="./">`（不再假设自己跑在 origin 根）：它的
    # `remoteStreamUrl()` 改用 `document.baseURI` 作基准，于是 WebSocket 被发到
    # `<前缀>/api/remote.mux`（= /lab/ws/<key>/api/remote.mux），绕过了上面那条
    # 只为 `<base href="/">` 准备的替换，经网关/上游那一跳后握手 404。
    # dsh 留了 `__DSH_TRANSPORT__.streamBaseUrl` 口子 —— 在 dsh 的 boot 之前把它钉回
    # origin，协议请求（尤其 WS）就重新落在根路径 `/api/**`，与 §8.7 已验证的 101 链路一致。
    #
    # 同一批 document-relative 改动也让 `dsh-client-hmr` 的 EventSource 变成相对
    # （`"/plugins/events".slice(1)`，且**没有**逃生舱），于是 SSE 也跑到了带前缀路径。
    # 这里补一段 EventSource hook：凡 path 落在 `plugins/events` 的，一律钉回
    # `<origin>/plugins/events`（= 0.1.5 时代走的那条已验证 location）。
    sub_filter '<base href="./">' '<base href="./"><script src="/wsbridge/client.js"></script><script>window.__DSH_TRANSPORT__={streamBaseUrl:location.origin};</script><script>!function(){var O=window.EventSource;function F(u,o){try{if(typeof u=="string"){var p=new URL(u,location.href).pathname;if(p.indexOf("/plugins/events")>-1)u=new URL("/plugins/events",location.origin).href}}catch(e){}return o===void 0?new O(u):new O(u,o)}F.prototype=O.prototype;F.CONNECTING=O.CONNECTING;F.OPEN=O.OPEN;F.CLOSED=O.CLOSED;window.EventSource=F}();</script>';
}

# 工作台实时通道的「普通 HTTPS 桥」（网关不透传 WebSocket 升级时的替代路径）
#   下行：GET  /wsbridge/events → SSE 流（必须关缓冲，否则被攒着不发）
#   上行：POST /wsbridge/send   → 一帧一个请求
#   另有 /wsbridge/ping（探测）、/wsbridge/client.js（适配脚本）、/wsbridge/close
# 上游由后端鉴权子请求下发的 X-Workspace-Bridge-Upstream（容器 IP:9091）决定；
# 没有它（桥未启用）就回落到容器主口 —— 客户端探测不到桥，自然走原生 WebSocket。
location ^~ /wsbridge/ {
    auth_request /__ws-auth-fallback;
    auth_request_set $ws_up_ws $upstream_http_x_workspace_upstream;
    auth_request_set $ws_up_bridge $upstream_http_x_workspace_bridge_upstream;

    proxy_pass http://$ws_final_bridge;
    proxy_http_version 1.1;
    proxy_set_header Host $ws_out_host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;          # SSE 关键：不缓冲
    proxy_cache off;
}

# FoxCMS 自己的 api 子应用：永远归 FoxCMS，即使浏览器带着工作台 cookie
location ^~ /api/project/ { proxy_pass http://127.0.0.1:8081; }

# dsh 写死的根路径前缀：按会话 cookie 认领容器，没有会话 → 回落 FoxCMS
location ^~ /api/ {
    auth_request /__ws-auth-fallback;
    auth_request_set $ws_up_ws $upstream_http_x_workspace_upstream;
    proxy_pass http://$ws_final_up;
    proxy_http_version 1.1;
    proxy_set_header Host $ws_out_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
location ^~ /plugins/ {
    auth_request /__ws-auth-fallback;
    auth_request_set $ws_up_ws $upstream_http_x_workspace_upstream;
    proxy_pass http://$ws_final_up;
    proxy_http_version 1.1;
    proxy_set_header Host $ws_out_host;
    proxy_read_timeout 3600s;
    proxy_buffering off;
}
location ^~ /open-in-app/ {
    auth_request /__ws-auth-fallback;
    auth_request_set $ws_up_ws $upstream_http_x_workspace_upstream;
    proxy_pass http://$ws_final_up;
    proxy_http_version 1.1;
    proxy_set_header Host $ws_out_host;
    proxy_buffering off;
}
