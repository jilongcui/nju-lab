# ===== NJU-Lab 平台侧实验工作台 —— http {} 级片段 =====
#
# 部署：cp 到 /etc/nginx/snippets/，并在 /etc/nginx/nginx.conf 的 **http {}** 里加一行
#       include /etc/nginx/snippets/medai-workspace-http.conf;
# 说明与实测：docs/DESIGN-2026-09-28-platform-workspace.md §4.5.2 · HANDOFF.md §8
#
# 另一半（主 server 内的 location）见 medai-workspace-server.conf。

# WebSocket 升级（若 http{} 里已有同名 map，删掉这里的、复用已有的）
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# 转发给容器时用的 Host（对外 authority）。
# ⚠️ 不要直接用 `$http_host`：上游反代若没配 `proxy_set_header Host`，nginx 会默认填
#    `$proxy_host`（= proxy_pass 的目标地址）。2026-09-29 抓包实测它传进来的是内网 IP
#    `10.28.128.56`，而 dsh 的 WebSocket 会拿 Origin（`https://medai.nju.edu.cn`）校验它
#    看到的 Host —— Host 不对时 **HTTP 全通、WebSocket 一律 403**
#    （表现：「页面能打开、一直 connection lost, retry #N」）。
# 这里做兜底：只有 Host 确实是 medai.nju.edu.cn（可带端口）时才原样透传，否则纠正回它。
# 上游把 Host 改对之后，本 map 退化为恒等映射、无副作用。
# 对外 authority 的唯一真源是后端的 WORKSPACE_PUBLIC_BASE（= http://medai.nju.edu.cn）。
map $http_host $ws_out_host {
    default                          medai.nju.edu.cn;
    ~*^medai\.nju\.edu\.cn(:\d+)?$   $http_host;
}

# 没有有效工作台会话 → 回落 FoxCMS 的内部 server
# ⚠️ 必须是 map：`if` 在 rewrite 阶段执行，读不到 access 阶段（auth_request_set）才有的值，
#    写成 if ($ws_up_ws = "") 会恒为真 → 所有请求都被回落（实测踩过）
map $ws_up_ws $ws_final_up {
    default $ws_up_ws;
    ""      127.0.0.1:8081;
}

# /wsbridge/ 的上游：后端在鉴权子请求里下发 X-Workspace-Bridge-Upstream（= 容器 IP:9091）。
# 桥没启用时（网关已支持 WebSocket）该头不存在 → 回落到容器主口，
# 此时 /wsbridge/* 会 404，客户端适配脚本因此不生效、自动走原生 WebSocket（即方案 A 的行为）。
map $ws_up_bridge $ws_final_bridge {
    default $ws_up_bridge;
    ""      127.0.0.1:8089;      # 没有会话 → 明确 403（见下面的内部 server），不要留空 upstream
}

# /wsbridge/ 在"没有有效会话"时的归宿：明确回 403。
# 客户端适配脚本据此判断"桥不可用"，干净地退回原生 WebSocket；
# 留空 upstream 会得到 nginx 的 500，既难看又让客户端无从判断（2026-09-29 实测踩过）。
server {
    listen 127.0.0.1:8089;
    server_name _;
    return 403 "no workspace session\n";
}

# 回落目标：FoxCMS 原样逻辑（复用现有 snippet，所以"回落"等价于"改动前的行为"）
server {
    listen 127.0.0.1:8081;
    server_name _;
    root /home/ubuntu/foxcms;
    index index.php index.html index.htm;
    include /etc/nginx/snippets/medai-foxcms.conf;
}
