# ===== NJU-Lab 平台侧实验工作台 —— http {} 级片段 =====
#
# 部署：cp 到 /etc/nginx/snippets/，并在 /etc/nginx/nginx.conf 的 **http {}** 里加一行
#       include /etc/nginx/snippets/medai-workspace-http.conf;
# 说明与实测：docs/DESIGN-2026-09-28-platform-workspace.md §4.5.2 · HANDOFF.md §8
#
# 另一半（主 server 内的 location）见 medai-workspace-server.conf。

# WebSocket 升级（若 http{} 里已有同名 map，删掉这里的、复用已有的）
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# 没有有效工作台会话 → 回落 FoxCMS 的内部 server
# ⚠️ 必须是 map：`if` 在 rewrite 阶段执行，读不到 access 阶段（auth_request_set）才有的值，
#    写成 if ($ws_up_ws = "") 会恒为真 → 所有请求都被回落（实测踩过）
map $ws_up_ws $ws_final_up {
    default $ws_up_ws;
    ""      127.0.0.1:8081;
}

# 回落目标：FoxCMS 原样逻辑（复用现有 snippet，所以"回落"等价于"改动前的行为"）
server {
    listen 127.0.0.1:8081;
    server_name _;
    root /home/ubuntu/foxcms;
    index index.php index.html index.htm;
    include /etc/nginx/snippets/medai-foxcms.conf;
}
