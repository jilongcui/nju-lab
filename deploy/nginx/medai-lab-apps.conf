# ===================================================================
# 学生应用「分享页」的短路径入口（2026-11-13）
#
# 目的：把分享链接从
#         /lab/api/apps/share/<shareKey>/site
#       变成
#         /lab/apps/share/<shareKey>/site
#       （去掉 `api` 段 —— 发给同学/写进课程文档更像一个页面地址）
#
# 为什么必须显式加这段：现网 `/lab` 只有两条前缀 location（见 medai-lab.conf）
#     location ^~ /lab/api/ { proxy_pass http://127.0.0.1:3100/api/; }
#     location ^~ /lab/     { root /var/www; try_files $uri $uri/ /lab/index.html; }
#   `/lab/apps/…` 只命中第二条 → 磁盘上没有该文件 → 回落 `/lab/index.html`，
#   返回的是**平台首页**（`200 text/html`）。分享者看到登录页、永远进不了应用，
#   而且状态码是 200，排查时容易被骗过（2026-11-13 实测确认）。
#
# 后端**一行都不用改**：`AgentAppShareController` 是 `@Controller('apps/share')`，
# 而 NestJS 侧有全局前缀 `app.setGlobalPrefix('api')`（`server/src/main.ts:8`）——
# 所以 **必须转到 `/api/apps/`**，不能转到 `/apps/`：
#   `/lab/apps/share/<key>/site` → `/api/apps/share/<key>/site` ✓
#   （转到 `/apps/...` 会得到 `Cannot GET …`，2026-11-13 用 nginx 容器实测过）
# 覆盖的路由：`/api/apps/share/<key>`、`…/site`、`…/site/<file>`、`…/api/chat`。
#
# 生效后还要做一步（否则链接仍是老路径）：
#     web/src/api/index.ts 里 `const APP_SHARE_PATH = 'api/apps/share';`
#     改成 `'apps/share'` → `cd web && npm run deploy:lab`（带 VITE_BASE=/lab/ 的构建）
#
# 落地：sudo bash deploy/apply-nginx-app-share.sh（幂等：备份 → 装片段 → 加 include →
#       nginx -t → reload → 自检 content-type；任一步失败自动回滚）
# 卸载：删掉 cms.conf 里的 include 这行 + 删本片段，reload 即可（应用 API 全在 /lab/api/ 下，不受影响）
# ===================================================================
location ^~ /lab/apps/ {
    # 注意尾部斜杠：`/lab/apps/` 被替换成 `/api/apps/`（后端全局前缀 api 不能省）
    proxy_pass http://127.0.0.1:3100/api/apps/;
    proxy_http_version 1.1;
    # 与 /lab/api/ 保持同一套头：应用容器首次启动 30–60 秒，超时给足，别用默认 60s
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;
}
