# 学生智能体应用的匿名分享入口。
#
# 新链接：/lab/share/<shareKey>
#   页面、静态资源与对话都转发到 NestJS 的 /api/share/<key> 别名。
# 旧链接：/lab/api/apps/share/<shareKey>/site 与 /lab/apps/share/<shareKey>/site 继续可用。
location ^~ /lab/share/ {
    proxy_pass http://127.0.0.1:3100/api/share/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;
}

# 兼容早期短路径，不再作为新生成链接的入口。
location ^~ /lab/apps/ {
    proxy_pass http://127.0.0.1:3100/api/apps/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;
}
