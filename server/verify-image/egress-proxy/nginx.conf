# NJU-Lab 复验出栈白名单代理（SNI 转发，客户端零改造、无需装证书）。
#
# 拓扑：复验容器 --[internal 网络 nju-verify-egress，无外网路由]--> 本代理
# （双宿主：nju-verify-egress + 默认 bridge）--> 公网。
# 复验容器用 --add-host 把白名单域名钉到代理 IP；TLS 直连 IP、非白名单域名
# 的 DNS 在 internal 网络里全失败，白名单域名的 SNI 经 ssl_preread 读出后转发。
#
# 由 DockerEvaluationRunner.ensureEgressProxy() 幂等创建/启动，见
# server/src/submissions/docker-evaluation-runner.ts。
worker_processes auto;

events {
  worker_connections 256;
}

stream {
  # docker 内嵌 DNS（容器挂在用户自定义网络 nju-verify-egress 上即可用）；
  # 短 TTL，白名单域名换 IP 时最多滞后 30s
  resolver 127.0.0.11 valid=30s ipv6=off;

  # SNI 白名单：只有列出的域名被转发；其余丢到不可达地址（连接即失败）
  map $ssl_preread_server_name $verify_upstream {
    api.deepseek.com  api.deepseek.com:443;
    api.moonshot.cn   api.moonshot.cn:443;
    default           127.0.0.1:1;
  }

  server {
    listen 443;
    ssl_preread on;
    proxy_pass $verify_upstream;
    proxy_connect_timeout 10s;
    proxy_timeout 300s;
  }
}
