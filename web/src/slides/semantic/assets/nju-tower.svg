<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-label="南京大学北大楼钟楼剪影">
  <!--
    南大钟楼（鼓楼校区北大楼）矢量剪影：主题「南大风」的封面/分节页辅助背景。
    自绘、无外部依赖、无第三方版权；不是校徽的替代品（校徽有使用规范，须另行提供官方文件）。
    颜色写死在 SVG 内（作为 background-image 渲染时拿不到外层 CSS 变量），
    因此换主色不影响它，整体浓淡由主题的 hero 不透明度令牌统一调。
    注意：XML 注释里不能出现连续两个减号，改注释时务必避开。
  -->
  <g fill="#4a1f7c" fill-opacity=".26">
    <!-- 台基 -->
    <rect x="40" y="742" width="1120" height="46" rx="6"/>
    <!-- 两侧翼楼 -->
    <rect x="140" y="582" width="252" height="160" rx="4"/>
    <rect x="808" y="582" width="252" height="160" rx="4"/>
    <!-- 翼楼山墙屋顶 -->
    <path d="M104 584 L266 494 L428 584 Z"/>
    <path d="M772 584 L934 494 L1096 584 Z"/>
    <!-- 主楼体 -->
    <rect x="378" y="474" width="444" height="268" rx="4"/>
    <!-- 主楼坡屋顶 -->
    <path d="M344 476 L856 476 L764 370 L436 370 Z"/>
    <!-- 中塔塔身 -->
    <rect x="538" y="214" width="124" height="268" rx="4"/>
    <!-- 塔檐（外挑一层 + 攒尖顶） -->
    <rect x="512" y="198" width="176" height="26" rx="4"/>
    <path d="M512 198 L600 92 L688 198 Z"/>
    <!-- 顶饰与旗杆 -->
    <circle cx="600" cy="82" r="13"/>
    <rect x="595" y="26" width="10" height="52" rx="3"/>
    <path d="M605 28 L676 48 L605 70 Z"/>
  </g>
  <g fill="#d8b45a" fill-opacity=".5">
    <!-- 主楼窗（一排） -->
    <rect x="412" y="522" width="46" height="76" rx="3"/>
    <rect x="486" y="522" width="46" height="76" rx="3"/>
    <rect x="560" y="522" width="46" height="76" rx="3"/>
    <rect x="634" y="522" width="46" height="76" rx="3"/>
    <rect x="708" y="522" width="46" height="76" rx="3"/>
    <!-- 翼楼窗 -->
    <rect x="188" y="624" width="42" height="62" rx="3"/>
    <rect x="256" y="624" width="42" height="62" rx="3"/>
    <rect x="856" y="624" width="42" height="62" rx="3"/>
    <rect x="924" y="624" width="42" height="62" rx="3"/>
    <!-- 塔身窗与钟面 -->
    <rect x="570" y="238" width="60" height="46" rx="4"/>
    <circle cx="600" cy="332" r="38"/>
  </g>
  <g fill="#4a1f7c" fill-opacity=".34">
    <circle cx="600" cy="332" r="27"/>
    <!-- 时针/分针 -->
    <rect x="597" y="312" width="6" height="24" rx="3"/>
    <rect x="597" y="330" width="18" height="6" rx="3"/>
    <!-- 塔基入口 -->
    <rect x="572" y="410" width="56" height="72" rx="6"/>
  </g>
</svg>
