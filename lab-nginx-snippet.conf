# ⚠️ 本文件是**带完整取舍说明的参考实现**。要直接落地，请用这两个片段：
#     deploy/nginx/medai-workspace-http.conf    （放进 http{}）
#     deploy/nginx/medai-workspace-server.conf  （放进 medai.nju.edu.cn 的 server）
#   两者已在容器里按现网 cms.conf 的真实结构拼装做过 `nginx -t` 校验。
#
# ⚠️ 2026-09-29 变更：本文件里的 `proxy_set_header Host $http_host;`，在线上已统一换成
#    `$ws_out_host`。原因：上游反代（219.219.122.131）没配 `proxy_set_header Host`，
#    nginx 默认填 `$proxy_host` = 我们的内网 IP，而 dsh 的 WebSocket 会拿 Origin 校验
#    它看到的 Host —— Host 不对时 HTTP 通、WebSocket 一律 403。`$ws_out_host` 是兜底 map
#    （定义见 deploy/nginx/medai-workspace-http.conf），把非 medai.nju.edu.cn 的 Host 纠正回来。

        # ===== NJU-Lab 实验平台（/lab 子目录，2026-09-22 部署）=====
        location = /lab {
            return 301 /lab/;
        }
        # API：去前缀转发到 NestJS（3100）；复验是长请求，读超时放宽到 11 分钟
        location ^~ /lab/api/ {
            proxy_pass http://127.0.0.1:3100/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 660s;
            proxy_send_timeout 660s;
        }
        # SPA 静态产物 + 学生安装包（/lab/kit/… 也由此出），root 映射避免 alias+try_files 坑
        location ^~ /lab/ {
            root /var/www;
            index index.html;
            try_files $uri $uri/ /lab/index.html;
        }

# ===== NJU-Lab 平台侧实验工作台（2026-09-28 实测通过；见 docs/DESIGN-2026-09-28-platform-workspace.md §4.5）=====
#
# 背景（两条硬事实，都实测过）：
#   1. 浏览器里的 dsh 把运行时路径**锚定在 origin 根** ——
#        RPC `new URL("/api/…", location.origin)`、WebSocket `wss://<origin>/api/remote.mux`、
#        SSE `/plugins/events`、插件包 `/plugins/??…`、`/open-in-app/*`。
#      页面可以放在子路径（HTML 能改写），但这些请求**不带任何前缀**。
#   2. medai 这个 origin 只有 80 端口、只有 `medai.nju.edu.cn` 一个 Host（校园网关按 Host 分发），
#      而 dsh 必须占「根」—— 根和 `/api` 都已被 FoxCMS 占用（`/api` 已从 dify 收回归 FoxCMS）。
#
# 于是采用「**一人一个 authority**」的等价物：**路径认页面 + cookie 认根路径**。
#   · 页面/资源：`/lab/ws/<wsKey>/…`（路径里带 key，nginx 直接取）
#   · dsh 写死的根路径：`/api/**`、`/plugins/**`、`/open-in-app/**`
#     → nginx 用**会话 cookie**（`nju_ws`）认领容器；没有/无效 cookie 的流量**原样回落** FoxCMS
#   · cookie 由后端 `GET /lab/api/workspace/enter?k=<wsKey>` 种下（302 到工作台首页）
#   · 前端「进入实验环境」直接导航到这个 enter 端点
#
# ⚠️ 三个实测踩过的坑，别改回去：
#   ① `auth_request` 的 URI **不支持变量**（当字面量处理）→ 传 key 只能靠「子请求里再读一次」
#      或共享变量；而 `rewrite … break` 会**终止同 location 后续的 rewrite 指令**（含 `set`）。
#      最后落定的写法：auth 子请求里直接读 `$cookie_nju_ws`（子请求能看到父请求的头）。
#   ② **不能用 `if` 判断 auth 结果**：`if` 在 rewrite 阶段，`auth_request_set` 在 access 阶段 ——
#      恒为空。必须用 `map`（惰性求值，到 `proxy_pass` 才取值）做「有会话 → 容器 / 无会话 → FoxCMS」。
#   ③ cookie 名必须用**下划线**（`nju_ws` → `$cookie_nju_ws`）：nginx 变量名不允许 `-`。
#
# ⚠️ 若将来拿到独立域名或端口（子域/端口形态），配置可以简化成「独占 authority」：
#    一个 server 块 + `map $host $ws_key`，不需要 cookie 分流、不需要 fallback server。
#    那种形态同样实测通过（见设计文档 §4.5.1）。

# --- ① 放进 http {} ---
#
# WebSocket 升级（若 http{} 里已有其它 map，合并即可）
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# 没有有效会话 → 回落 FoxCMS 的内部 server（见 ②）
# ⚠️ 必须是 map：用 if 读 `$ws_up_ws` 永远为空（if 在 rewrite 阶段，见上文坑②）
map $ws_up_ws $ws_final_up {
    default $ws_up_ws;
    ""      127.0.0.1:8081;      # 没有工作台会话 → 回落 FoxCMS（保持改动前行为）
}

# /wsbridge/ 没有会话时 → 明确 403（留空 upstream 会变成 500）
map $ws_up_bridge $ws_final_bridge {
    default $ws_up_bridge;
    ""      127.0.0.1:8089;
}
server { listen 127.0.0.1:8089; server_name _; return 403 "no workspace session\n"; }

# --- ② 放进 http {}：FoxCMS 回落用的内部 server ---
#
# 复用现有 FoxCMS snippet（root / 静态 / PHP-FPM 全都在里面），
# 于是「回落」等价于「回到改动前的行为」，不用复刻任何逻辑。
server {
    listen 127.0.0.1:8081;
    server_name _;
    root /home/ubuntu/foxcms;
    index index.php index.html index.htm;
    include /etc/nginx/snippets/medai-foxcms.conf;
}

# --- ③ 放进主 server（medai.nju.edu.cn 那个）---
#
# 工作台鉴权子请求：用会话 cookie 换容器 upstream。
# `mode=fallback` = 查不到会话时 204 且不带 header（供下面的 map 回落）；
# 不带 mode = 严格 403（页面入口用，伪造 key 必须被拒）。
location = /__ws-auth-fallback {
    internal;
    proxy_pass http://127.0.0.1:3100/api/workspace/proxy-auth?k=$cookie_nju_ws&mode=fallback;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
}
location = /__ws-auth-strict {
    internal;
    proxy_pass http://127.0.0.1:3100/api/workspace/proxy-auth?k=$cookie_nju_ws;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
}

# 工作台页面/静态资源：`/lab/ws/<wsKey>/…`（^~ 前缀，压过 FoxCMS 的 `\.(js|css|…)$` 正则）
location ^~ /lab/ws/ {
    # 供响应阶段（proxy_redirect / sub_filter）用；必须在 rewrite 之前（坑①）
    set $ws_page_key "";
    if ($cookie_nju_ws ~ "^[0-9a-f]{32}$") { set $ws_page_key $cookie_nju_ws; }
    # 去掉 `/lab/ws/<key>` 前缀 —— dsh 期望自己在根路径
    rewrite "^/lab/ws/(?<pk2>[0-9a-f]{32})(/.*)?$" $2 break;

    auth_request /__ws-auth-strict;
    auth_request_set $ws_up_page $upstream_http_x_workspace_upstream;

    proxy_pass http://$ws_up_page;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;      # 外部 authority：WebSocket 的 Origin 校验依赖它
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    # dsh 的 303 是 `location: /` → 改回带前缀；HTML 的 `<base href="/">` 同理
    # （相对路径 `./assets`、`./manifest.webmanifest` 靠它解析到本前缀）
    proxy_redirect ~^/(.*)$ /lab/ws/$ws_page_key/$1;
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter '<base href="/">' '<base href="/lab/ws/$ws_page_key/">';
}

# FoxCMS 自己的 api 子应用：**永远**归 FoxCMS，即使浏览器带着工作台 cookie
location ^~ /api/project/ { proxy_pass http://127.0.0.1:8081; }

# dsh 写死的根路径前缀：按会话 cookie 认领容器；没有会话 → 回落 FoxCMS
location ^~ /api/ {
    auth_request /__ws-auth-fallback;
    auth_request_set $ws_up_ws $upstream_http_x_workspace_upstream;
    proxy_pass http://$ws_final_up;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
location ^~ /plugins/ {
    auth_request /__ws-auth-fallback;
    auth_request_set $ws_up_ws $upstream_http_x_workspace_upstream;
    proxy_pass http://$ws_final_up;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_read_timeout 3600s;
    proxy_buffering off;                    # SSE（/plugins/events）
}
location ^~ /open-in-app/ {
    auth_request /__ws-auth-fallback;
    auth_request_set $ws_up_ws $upstream_http_x_workspace_upstream;
    proxy_pass http://$ws_final_up;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_buffering off;
}

# 已知边界：
#   · 会话 cookie 只有一个 → 同一浏览器同时只能进一个工作台会话（一人一浏览器，可接受；
#     多人共用一台机器时后进入者会顶掉前一个）。
#   · dsh 升级若新增别的**根路径前缀**，要在上面补一个 location（当前为 /api、/plugins、/open-in-app）。
#   · `$http_host` 必须原样传给容器：dsh 的 WebSocket 会校验 Origin 与它看到的 Host 一致。
#     后端会把该 authority（`WORKSPACE_PUBLIC_BASE`）自动注入容器的 `--trusted-host`。
