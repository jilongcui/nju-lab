
        # ===== NJU-Lab 实验平台（/lab 子目录，2026-09-22 部署）=====
        location = /lab {
            return 301 /lab/;
        }
        # API：去前缀转发到 NestJS（3100）；复验是长请求，读超时放宽到 11 分钟
        location ^~ /lab/api/ {
            proxy_pass http://127.0.0.1:3100/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 660s;
            proxy_send_timeout 660s;
        }
        # SPA 静态产物 + 学生安装包（/lab/kit/… 也由此出），root 映射避免 alias+try_files 坑
        location ^~ /lab/ {
            root /var/www;
            index index.html;
            try_files $uri $uri/ /lab/index.html;
        }

        # ===== NJU-Lab 平台侧实验工作台（2026-09-28）=====
        # 学生**直接导航**到 /lab/ws/<wsKey>/?token=… —— 浏览器不带 JWT，
        # 所以鉴权交给后端：auth_request 用 wsKey 换容器 upstream，再动态 proxy_pass。
        #
        # ⚠️ 三条硬约束（都是实测得出的，别"优化"掉）：
        #   1. 目标必须是**容器 IP**：`--internal` 网络下 `-p` 端口映射静默失效；
        #      宿主对隔离网段有直连路由（br-xxxx 的 172.18.0.1/16）。
        #   2. `Host` 必须与容器内 dsh 的 `--trusted-host` 一致 —— entrypoint 会自动把
        #      自己的 `IP:port` 加进信任列表，所以这里传 $ws_upstream。
        #   3. dsh 的 303 用的是 `location: /`（绝对路径），必须 proxy_redirect 改回
        #      带前缀的路径；HTML 里的 `<base href="/">` 也要 sub_filter 改写。
        #
        # ⚠️ 本节**尚未在真实 nginx 上验证**（2026-09-28 仅完成后端与容器侧实测）。
        #    部署时请重点核对 proxy_redirect / sub_filter 与 WebSocket 升级。
        #    另：$connection_upgrade 需在 http{} 里定义，否则 nginx -t 会报未知变量：
        #        map $http_upgrade $connection_upgrade { default upgrade; '' close; }

        # 鉴权子请求：wsKey → 容器 upstream（后端返回 204 + X-Workspace-Upstream）
        location = /lab/ws-auth {
            internal;
            proxy_pass http://127.0.0.1:3100/api/workspace/proxy-auth?k=$ws_key;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
        }

        location ~ ^/lab/ws/(?<ws_key>[A-Za-z0-9_-]+)(?<ws_rest>/.*)?$ {
            auth_request /lab/ws-auth;
            auth_request_set $ws_upstream $upstream_http_x_workspace_upstream;

            # 去掉 /lab/ws/<key> 前缀，让 dsh 看到它期望的根路径
            rewrite ^/lab/ws/[A-Za-z0-9_-]+/?(.*)$ /$1 break;

            proxy_pass http://$ws_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $ws_upstream;
            # dsh web 可能使用 WebSocket（待实测）；先按升级处理
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # dsh 的 303 `location: /` → 改回带前缀
            proxy_redirect ~^/(.*)$ /lab/ws/$ws_key/$1;

            # dsh 的 index.html 带 <base href="/">，静态资源走绝对路径 —— 带上前缀
            sub_filter_once on;
            sub_filter '<base href="/">' '<base href="/lab/ws/$ws_key/">';
        }
