
        # ===== NJU-Lab 实验平台（/lab 子目录，2026-09-22 部署）=====
        location = /lab {
            return 301 /lab/;
        }
        # API：去前缀转发到 NestJS（3100）；复验是长请求，读超时放宽到 11 分钟
        location ^~ /lab/api/ {
            proxy_pass http://127.0.0.1:3100/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 660s;
            proxy_send_timeout 660s;
        }
        # SPA 静态产物 + 学生安装包（/lab/kit/… 也由此出），root 映射避免 alias+try_files 坑
        location ^~ /lab/ {
            root /var/www;
            index index.html;
            try_files $uri $uri/ /lab/index.html;
        }
