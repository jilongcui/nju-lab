        # ===== NJU-Lab 实验平台（/lab 子目录，2026-09-22 部署）=====
        location = /lab {
            return 301 /lab/;
        }
        # API：去前缀转发到 NestJS（3100）；复验是长请求，读超时放宽到 11 分钟
        location ^~ /lab/api/ {
            proxy_pass http://127.0.0.1:3100/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 660s;
            proxy_send_timeout 660s;
        }
        # SPA 静态产物 + 学生安装包（/lab/kit/… 也由此出），root 映射避免 alias+try_files 坑
        location ^~ /lab/ {
            root /var/www;
            index index.html;
            try_files $uri $uri/ /lab/index.html;
        }

# ===== NJU-Lab 平台侧实验工作台（2026-09-28 实测通过；见 docs/DESIGN-2026-09-28-platform-workspace.md §4.5）=====
#
# 形态：**每个学生独占一个 authority** —— `<wsKey>.<工作台域>` 的**根路径**。
# 浏览器访问 `https://<wsKey>.<工作台域>/?token=…` → auth_request 用 wsKey 换容器 upstream
# → 动态 proxy_pass 到容器 `IP:9090`（`--internal` 网络下 `-p` 端口映射静默失效，只能走容器 IP）。
#
# ⚠️ 为什么**不能**用 `/lab/ws/<key>/` 子路径做（2026-09-28 实测证伪，别改回去）
#   浏览器里的 dsh 把运行时路径全部锚定在 **origin 根**：
#     · RPC        new URL("/api/…", location.origin)
#     · WebSocket  wss://<origin>/api/remote.mux
#     · SSE        /plugins/events
#     · 插件包      /plugins/??…（index.html 里的绝对路径）
#   它们都不随页面路径走，`proxy_redirect` / `sub_filter` 改不动运行时的字符串拼接。
#   实测：子路径下页面能开（HTML 改写生效），但 `/api/remote.mux` 会命中宿主根的 /api
#   （njuserver 上是 dify → 502）、`/plugins/events` → 404 —— 页面能开、功能全废。
#
# ⚠️ 必须 `proxy_set_header Host $http_host`（传**外部 authority**），**不能**传容器 IP：
#   dsh 的 WebSocket 会校验 Origin 与它看到的 Host 是否一致（是否受信任）。
#   实测：Host 传容器 IP 时 HTTP 全部正常、**WebSocket 一律 403**；传外部 authority 后 101。
#   对应地，后端把该 authority 经 WORKSPACE_TRUSTED_HOSTS 传进容器 —— 后端按
#   `WORKSPACE_PUBLIC_BASE` 里的 {key} 自动展开，不需要在这里手工维护域名清单。
#
# ⚠️ 前置条件（部署前必须办，缺一不可）：
#   1. DNS：`*.<工作台域>` 泛解析到本机（一人一个子域）
#   2. 证书：覆盖 `*.<工作台域>`（校园网关只认 Host，Host 必须可路由）
#   3. `http {}` 里定义 $connection_upgrade（否则 nginx -t 报未知变量）：
#        map $http_upgrade $connection_upgrade { default upgrade; '' close; }
#   4. 后端 `WORKSPACE_PUBLIC_BASE=https://{key}.<工作台域>`

# --- ① 放进 http {}（与其它 map 并列）---
#
# 从 Host 取 wsKey。wsKey 是 16 字节 hex、全小写：hostname 本来就会被小写化
# （URL 规范与浏览器都如此），所以 key 必须是大小写安全的编码（base64url 会被改写、
# auth 查不到会话 → 一律 403，实测踩过）。
map $host $ws_key {
    default "";
    ~^(?<key>[0-9a-f]{32})\.ws\.<工作台域>$ $key;
}

# --- ② 独立 server 块（不是 medai server 里的 location）---
server {
    listen 80;   # 线上按需改 443 ssl
    server_name ~^[0-9a-f]{32}\.ws\.<工作台域>$;

    # 鉴权子请求：wsKey → 容器 upstream（后端返回 204 + X-Workspace-Upstream）
    location = /__ws-auth {
        internal;
        proxy_pass http://127.0.0.1:3100/api/workspace/proxy-auth?k=$ws_key;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
    }

    location / {
        auth_request /__ws-auth;
        auth_request_set $ws_upstream $upstream_http_x_workspace_upstream;

        proxy_pass http://$ws_upstream;
        proxy_http_version 1.1;
        # 外部 authority：WebSocket 的 Origin 校验依赖它（传容器 IP 会 403）
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # SSE（/plugins/events）与长轮询都要关缓冲
        proxy_buffering off;

        # 根路径语义下 **不需要** proxy_redirect / sub_filter：
        # dsh 的 303 就是 `location: /`，index.html 的 `<base href="/">` 也是对的。
    }
}
